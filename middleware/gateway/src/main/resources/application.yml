server:
  port: 30000

spring:
#  redis:
#    host: localhost
#    port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        cluster-name: Cluster-A
        namespace: dev
        group: myGroup
        register-enabled: true
#        watch:
#          enabled: true
#        watch-delay: 30000
    gateway:
      discovery:
        locator:
          # 创建默认路由，以"/服务名称/接口地址"的
          lower-case-service-id: true
          enabled: true

        globalcors:
          cors-configurations:
            '[/**]':
              # 授信地址列表
              allowed-origins:
                - "http://localhost:10000"
                - "https://www.geekbang.com"
              # cookie, authorization认证信息
              expose-headers: "*"
              allowed-methods: "*"
              allow-credentials: true
              allowed-headers: "*"
              max-age: 1000